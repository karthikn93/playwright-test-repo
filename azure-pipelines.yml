# Node.js - Cucumber + Playwright (Windows)
# Runs Cucumber BDD tests using Playwright on a Windows agent
# and narrates failures using GitHub Copilot CLI

trigger:
  - main

pool:
  vmImage: windows-latest

steps:
  # 1. Install Node.js
  - task: UseNode@1
    inputs:
      version: "22.x"
    displayName: "Install Node.js"

  # 2. Install dependencies and Playwright browsers
  - script: npm ci
    displayName: "Install dependencies"

  - script: npx playwright install chromium
    displayName: "Install Playwright Chromium browser"

  # 3. Run Cucumber tests (continues even on failure so AI narrator still runs)
  - script: |
      npm run test:cucumber
    displayName: "Run Cucumber tests"
    continueOnError: true

  # 4. Install GitHub Copilot CLI
  - script: npm install -g @github/copilot
    displayName: "Install GitHub Copilot CLI"
    continueOnError: true

  # 5. AI Failure Narrator (Windows script)
  - script: |
      echo "Node version:"
      node --version
      echo "Checking test-results.json exists:"
      if exist test-results.json (echo Found test-results.json) else (echo test-results.json NOT found)
      echo "Running AI narrator..."
      node scripts\windows\ai-failure-narrator.js test-results.json
      echo "AI narrator finished with exit code: %ERRORLEVEL%"
    displayName: "🧠 AI Failure Narrator"
    condition: always()
    env:
      GITHUB_TOKEN: $(GITHUB_TOKEN)

  # 5. Publish AI report as artifact
  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: "ai-failure-report.json"
      ArtifactName: "AI-Failure-Analysis"
    displayName: "Publish AI Failure report"
    condition: always()

  # 6. Publish Cucumber JSON report as artifact
  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: "test-results.json"
      ArtifactName: "Cucumber-Test-Results"
    displayName: "Publish Cucumber JSON report"
    condition: always()
